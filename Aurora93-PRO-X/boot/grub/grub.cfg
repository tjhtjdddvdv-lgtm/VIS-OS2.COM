set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search

set gfxmode=auto
terminal_output gfxterm

menuentry "VIS OS Aurora 93 PRO X — Live" {
    echo "VIS OS boot entry is a template until kernel and initramfs are integrated."
    # Replace these paths only after a verified kernel/initramfs build:
    # linux /live/vmlinuz boot=live quiet splash
    # initrd /live/initrd.img
}

menuentry "VIS OS Aurora 93 PRO X — Safe graphics" {
    echo "Safe graphics entry requires an integrated kernel and initramfs."
    # linux /live/vmlinuz boot=live nomodeset
    # initrd /live/initrd.img
}

menuentry "Hardware diagnostics" {
    echo "Diagnostics entry is reserved for the diagnostic initramfs."
}
